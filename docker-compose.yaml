services:
    postgres:
        image: postgres:latest
        container_name: postgres_db
        environment:
            - POSTGRES_USER=cloud_user
            - POSTGRES_PASSWORD=cloudcloud
            - POSTGRES_DB=cloud_db
        ports:
            - "5432:5432"
        volumes:
            - postgres_cloud_data:/var/lib/postgresql/data
    
    adminer:
        image: adminer
        container_name: adminer_ui
        ports:
            - "8080:8080"
        depends_on:
            - postgres
        environment:
            ADMINER_DEFAULT_SERVER: postgres

volumes:
    postgres_cloud_data:
